name: IceSL-website CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # SP 2025-10-20: Get Windows and Linux builds from IceSL's repo and place them on their appropriate folders
      #    IceSL Windows: ./assets/builds/windows/amd64
      #    IceSL Linux: ./assets/builds/linux/amd64
      # SP 2025-10-20: Get the Python bindings builds from PyIceSL's repo and place them on their appropriate folders:
      #    PyIceSL windows: ./assets/builds/windows/amd64/pyicesl
      #    PyIceSL Linux: ./assets/builds/linux/amd64/pyicesl
      # SP 2025-10-20: Get 'Slicecrafter', 'IceSL-online' emscripten latest builds and place them on the appropriate folders
      #    Slicecrafter: ./slicecrafter
      #    IceSL-online: ./icesl-online
      # SP 2025-10-20:
      #    - Copying the above files might be as simple as detching files with wget using their permalinks (from IceSL's repo)
      #    - IceSL and PyIceSL's CD needs to commit these files in a separate build folder
      - run: wget --header 'Authorization: token ${{ secrets.WGET_TOKEN }}' https://raw.githubusercontent.com/icesl/icesl-builds/master/vrprinter/emscripten/vrprinter.zip
      - run: unzip vrprinter.zip -d webprinter
      - run: sudo apt-get install rubygems ruby-dev
      - run: sudo gem install jekyll bundler
      - run: bundle config set --local path 'vendor/bundle'
      - run: bundle install
      - run: bundle exe jekyll build --baseurl "https://icesl.github.io/icesl-website"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
          retention-days: 1

  deploy-linux:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - uses: actions/deploy-pages@v4
