name: IceSL-website CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: sudo apt-get install rubygems ruby-dev
      - run: sudo gem install jekyll bundler
      - run: bundle config set --local path 'vendor/bundle'
      - run: bundle install
      - run: bundle exe jekyll build --baseurl "https://icesl.github.io"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
          retention-days: 1

  deploy-linux:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - uses: actions/deploy-pages@v4
