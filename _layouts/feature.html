<html>
	<head>
    {% include head.html %}
	</head>
	<body class="is-loading">

		<!-- Wrapper -->
			<div id="wrapper" class="fade-in">

				<!-- Header -->
        <header id="header">
<!--
						<a href="{{ "/" | prepend: site.baseurl }}" class="logo">{{site.title}}</a>
-->
						<a href="{{ "/" | prepend: site.baseurl }}" class="logo" style="border-style:none"><img height="50px" src="{{ "/assets/img/name-cropped2.png" | prepend: site.baseurl }}"/></a>
        </header>

				<!-- Nav -->
					<nav id="nav">

            {% include nav.html %}

						<ul class="icons">
              <li><a href="https://twitter.com/{{site.twitter}}" class="icon fa-twitter" rel="nofollow"><span class="label">Twitter</span></a></li>
              <li><a href="https://groups.google.com/forum/#!forum/{{site.google}}" class="icon fa-google" rel="nofollow"><span class="label">Google</span></a></li>
              <li><a href="https://github.com/{{site.github}}" class="icon fa-github" rel="nofollow"><span class="label">GitHub</span></a></li>
						</ul>
					</nav>

				<!-- Main -->
				<div id="main">
          <section class="post">
    				<header class="major">
      				<hPA>{{page.title}}</hPA>
      				<p>{{page.excerpt}}</p>
      			</header>
      			<p>{{content}}</p>
            <center><img class="smallest" src="{{ "/assets/img/logo-cropped1.png" | prepend: site.baseurl }}"/></center>
      		</section>

				</div>

				<!-- Footer -->
        {% include foot.html %}

			</div>

      <!-- Scripts -->
  		{% include scripts-main.html %}
			{% include tracking.html %}

	</body>
</html>
