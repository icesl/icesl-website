<ul class="links">
  <li><a href="{{ "/#header" | prepend: site.baseurl }}">Home</a></li>
  {% assign sorted_pages = site.pages | sort:'order' %}
  {% for page in sorted_pages %}
    {% if page.exclude == false %}
     <li><a href={{ page.permalink | prepend: site.baseurl }}>{{ page.title }}</a></li>
    {% endif %}
  {% endfor %}
</ul>
